name: supabase_flutter_app
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8

  flutter_bloc: ^9.1.1
  supabase_flutter: ^2.12.0
  intl: ^0.20.2
  equatable: ^2.0.7
  shared_preferences: ^2.3.4
  crypto: ^3.0.3
  
  # Authentication
  google_sign_in: ^6.1.5
  sign_in_with_apple: ^7.0.1
  
  # Phone Auth UI
  country_code_picker: ^3.0.0
  pin_code_fields: ^8.0.1
  
  # Media Handling
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  video_player: ^2.8.2
  image: ^4.1.7
  
  # Audio
  record: ^6.1.2
  just_audio: ^0.9.36
  
  # Contacts & Permissions
  permission_handler: ^11.3.0
  
  # Utilities
  path_provider: ^2.1.2
  cached_network_image: ^3.3.1
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0
  
  # Testing packages
  bloc_test: ^10.0.0
  mocktail: ^1.0.4


flutter:


  uses-material-design: true

